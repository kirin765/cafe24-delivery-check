<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>디지털 상품 발송 설정 점검 — 스토리 대표 이미지</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans CJK KR", "Apple SD Gothic Neo", sans-serif;
    width: 444px; height: 320px; overflow: hidden;
    background: linear-gradient(150deg, #0f172a 0%, #1e3a8a 58%, #1d4ed8 100%);
    color: #fff; padding: 34px 34px; display: flex; flex-direction: column; justify-content: center;
  }
  .badge {
    display: inline-block; align-self: flex-start; background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
    padding: 6px 13px; font-size: 12px;
  }
  h1 { font-size: 27px; font-weight: 800; line-height: 1.34; margin-top: 16px; }
  h1 em { font-style: normal; color: #bfdbfe; }
  p { font-size: 13px; color: #cbd9f7; margin-top: 10px; line-height: 1.6; }
  .row { display: flex; gap: 16px; margin-top: 16px; font-size: 12px; color: #bfdbfe; font-weight: 700; }
</style>
</head>
<body>
  <span class="badge">카페24 앱 · 발송 설정 점검</span>
  <h1>발송 규칙이 빠진<br><em>디지털 상품을 찾습니다</em></h1>
  <p>상품 목록과 규칙을 대조해 누락·비활성을 표시합니다.</p>
  <div class="row"><span>상품 목록</span><span>→</span><span>규칙 대조</span><span>→</span><span>체크리스트</span></div>
</body>
</html>
